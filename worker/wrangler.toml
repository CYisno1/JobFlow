# Worker deployment config, read by wrangler.
name = "jobflow-worker"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Cron: crawl every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

# Tunables (plain values, not secrets). Changing them needs a redeploy.
[vars]
SCORE_THRESHOLD = "70"      # send Telegram matches at or above this AI score (0-100)
SCORE_MAX_PER_RUN = "20"    # jobs scored per 30-min run; the rest wait in the queue
NOTIFY_MAX_PER_RUN = "10"   # Telegram messages per run; the rest wait in the queue
# Free plan: 50 subrequests per run. Each score and each message is one;
# keep SCORE_MAX_PER_RUN + NOTIFY_MAX_PER_RUN at or below ~38.

# KV binding: env.SEEN in code maps to this namespace
[[kv_namespaces]]
binding = "SEEN"
id = "b2ee910b766a4303bc57b46e540232e8"

# Secrets are NOT stored here (this file is committed to git).
# Set them with: npx wrangler secret put <NAME>   — see README.md for the list.
